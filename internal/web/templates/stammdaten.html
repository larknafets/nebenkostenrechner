{{define "content"}}
<h1>Stammdaten</h1>
{{template "nav" .}}

<form method="post" action="{{.Base}}/stammdaten" class="panel dirty-form">
  {{range .Apartments}}
  <div class="grid grid-2">
    <div class="field"><label>Wohnungsgröße {{.Name}} (m²)</label><input type="number" step="any" name="qm_{{.ID}}" value="{{.QM}}" required></div>
    <div class="field"><label>Flurstücksgröße {{.Name}} (m²)</label><input type="number" step="any" name="flurstueck_groesse_{{.ID}}" value="{{.FlurstueckGroesse}}" required></div>
  </div>
  {{end}}

  <div class="btn-row">
    <button type="submit" class="primary dirty-save" disabled>Speichern</button>
  </div>
</form>

<script>
  document.querySelectorAll(".dirty-form").forEach(function (form) {
    var save = form.querySelector(".dirty-save");
    ["input", "change"].forEach(function (ev) {
      form.addEventListener(ev, function () { save.disabled = false; });
    });
  });
</script>
{{end}}
