{{define "content"}}
<h1>Stammdaten</h1>
{{template "nav" .}}

<form method="post" action="{{.Base}}/stammdaten" class="dirty-form">
  <div class="grid grid-2">
    {{range .Apartments}}
    <div class="panel">
      <h3>{{.Name}}</h3>
      <div class="field"><label>Wohnungsgröße (m²)</label><input type="number" step="any" name="qm_{{.ID}}" value="{{.QM}}" required {{if not $.IsLoggedIn}}disabled{{end}}></div>
      <div class="field"><label>Flurstücksgröße (m²)</label><input type="number" step="any" name="flurstueck_groesse_{{.ID}}" value="{{.FlurstueckGroesse}}" required {{if not $.IsLoggedIn}}disabled{{end}}></div>
    </div>
    {{end}}
  </div>

  {{if .IsLoggedIn}}
  <div class="btn-row">
    <button type="submit" class="primary dirty-save" disabled>Speichern</button>
  </div>
  {{end}}
</form>

<script>
  document.querySelectorAll(".dirty-form").forEach(function (form) {
    var save = form.querySelector(".dirty-save");
    ["input", "change"].forEach(function (ev) {
      form.addEventListener(ev, function () { save.disabled = false; });
    });
  });
</script>
{{end}}
