version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: nebenkostenrechner
    main: ./cmd/nebenkostenrechner
    binary: nebenkostenrechner
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildDate={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "7"

archives:
  - id: nebenkostenrechner
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: desc
  abbrev: 7
  format: >-
    {{ .SHA }} {{ trimprefix (trimprefix (trimprefix (trimprefix (trimprefix .Message "feat: ") "fix: ") "refactor: ") "docs: ") "style: " }}
  groups:
    - title: "Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "Refactoring"
      regexp: '^refactor(\(.+\))?:'
      order: 2
    - title: "Documentation"
      regexp: '^docs(\(.+\))?:'
      order: 3
    - title: "Style"
      regexp: '^style(\(.+\))?:'
      order: 4
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  header: |
    ## Changelog
  github:
    owner: larknafets
    name: nebenkostenrechner
