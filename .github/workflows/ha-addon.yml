name: Update HA Add-on

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  hassio:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ha-addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: larknafets/ha-addons
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/larknafets/nebenkostenrechner/tags --paginate \
            --jq "first(.[] | select(.commit.sha == \"${HEAD_SHA}\") | .name)")
          if [ -z "$tag" ]; then
            echo "No tag found for commit ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      # Not GITHUB_REF_NAME: the runner overwrites GITHUB_* variables inside
      # the shell (on workflow_run it is the branch name, "main").
      - name: Update version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i -e "s/^version:.*/version: \"${version}\"/" ./hassio/nebenkostenrechner/config.yaml

      - name: Copy changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh api "repos/larknafets/nebenkostenrechner/contents/CHANGELOG.md?ref=${RELEASE_TAG}" \
            -H 'Accept: application/vnd.github.raw' > ./hassio/nebenkostenrechner/CHANGELOG.md

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          cd ./hassio
          [ -z "$(git status --porcelain)" ] && exit 0
          # GitHub creates and signs the commit (Verified); a commit made on the
          # runner would be unsigned. expectedHeadOid fails if main moved meanwhile.
          out=$(jq -n \
            --arg oid "$(git rev-parse HEAD)" \
            --arg headline "Mirror nebenkostenrechner release ${RELEASE_TAG}" \
            --arg config "$(base64 -w0 nebenkostenrechner/config.yaml)" \
            --arg changelog "$(base64 -w0 nebenkostenrechner/CHANGELOG.md)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: "larknafets/ha-addons", branchName: "main"},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: [
                  {path: "nebenkostenrechner/config.yaml", contents: $config},
                  {path: "nebenkostenrechner/CHANGELOG.md", contents: $changelog}]}}}}' \
            | gh api graphql --input -)
          echo "$out" | jq -e -r '.data.createCommitOnBranch.commit.url'
