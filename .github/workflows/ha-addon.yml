name: Update HA Add-on

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  hassio:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ha-addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: larknafets/ha-addons
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/larknafets/nebenkostenrechner/tags --paginate \
            --jq "first(.[] | select(.commit.sha == \"${HEAD_SHA}\") | .name)")
          if [ -z "$tag" ]; then
            echo "No tag found for commit ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      # Not GITHUB_REF_NAME: the runner overwrites GITHUB_* variables inside
      # the shell (on workflow_run it is the branch name, "main").
      - name: Update version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i -e "s/^version:.*/version: \"${version}\"/" ./hassio/nebenkostenrechner/config.yaml

      - name: Copy changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh api "repos/larknafets/nebenkostenrechner/contents/CHANGELOG.md?ref=${RELEASE_TAG}" \
            -H 'Accept: application/vnd.github.raw' > ./hassio/nebenkostenrechner/CHANGELOG.md

      - name: Push
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          cd ./hassio
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nebenkostenrechner/config.yaml nebenkostenrechner/CHANGELOG.md
          git commit -m "Mirror nebenkostenrechner release ${RELEASE_TAG}"
          git push
