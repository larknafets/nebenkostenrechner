name: Nightly

# Builds the Docker image of main every night and points the HA add-on
# "Nebenkosten (Nightly)" in larknafets/ha-addons at it. A manual run
# (workflow_dispatch) builds the selected branch and always runs, so a
# branch can be tried in Home Assistant before it is merged - the next
# nightly run replaces it.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check latest commit
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Skip scheduled run without a commit in the last 24 hours
        id: should_run
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git rev-list --after='24 hours ago' HEAD)" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nightly version
        id: version
        run: |
          set -euo pipefail
          echo "version=nightly.$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  image:
    name: Build and push image
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Read Go version
        id: goversion
        run: echo "version=$(grep '^go ' go.mod | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=raw,value=${{ needs.check.outputs.version }}

      - name: Set build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The add-on lists only amd64 and aarch64 (ha-addons config.yaml).
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            GO_VERSION=${{ steps.goversion.outputs.version }}

  addon:
    name: Update HA add-on
    needs: [check, image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ha-addons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: larknafets/ha-addons
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Update version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -e "s/^version:.*/version: \"${VERSION}\"/" ./hassio/nebenkostenrechner-nightly/config.yaml

      - name: Push
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cd ./hassio
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nebenkostenrechner-nightly/config.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Mirror nebenkostenrechner nightly ${VERSION}"
          git push

  cleanup:
    name: Keep the newest 7 nightly images
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The moving tag "nightly" is excluded and always shares its image with
      # the newest dated tag, so it never counts against the 7.
      - name: Delete older nightly images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          package: nebenkostenrechner
          delete-tags: "nightly.*"
          exclude-tags: nightly
          keep-n-tagged: 7
