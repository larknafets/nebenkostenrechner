name: GHCR cleanup

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete untagged and partial images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
        with:
          package: nebenkostenrechner
          delete-untagged: true
          delete-partial-images: true
          older-than: "1 day" # keeps digests from an in-flight manifest-list build
